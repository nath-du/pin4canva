<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Pin4Canva</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- App bar -->
  <header class="app-bar">
    <span class="app-title">
      <span class="material-icons">push_pin</span>
      Pin4Canva
    </span>
    <button class="settings-btn" id="settingsBtn" aria-label="Impostazioni">
      <span class="material-icons">settings</span>
    </button>
  </header>

  <!-- Tabs -->
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="search" role="tab" aria-selected="true">
      <span class="material-icons" style="font-size:18px;">search</span>
      Search
    </button>
    <button class="tab" data-tab="collection" role="tab" aria-selected="false">
      <span class="material-icons" style="font-size:18px;">folder</span>
      Your Collection
      <span class="badge" id="collectionBadge">0</span>
    </button>
  </div>

  <!-- Vista Cerca -->
  <section id="searchView" class="view" role="tabpanel">
    <div class="search-bar">
      <div class="text-field">
        <span class="material-icons prefix">search</span>
        <input type="text" id="searchInput" placeholder="Search on Pinterest…" autofocus />
      </div>
      <button class="btn-primary" id="searchBtn">
        <span class="material-icons">arrow_forward</span>
      </button>
    </div>

    <div class="toggle-row">
      <label class="switch">
        <input type="checkbox" id="autoRemoveBg" />
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Background remover</span>
      <select id="servizioBg" class="servizio-select" title="Servizio rimozione sfondo" disabled>
        <option value="alphelo">Alphelo</option>
        <option value="removebg">Remove.bg</option>
        <option value="clipdrop">Clipdrop</option>
        <option value="photoroom">Photoroom</option>
      </select>
    </div>

    <div id="status" class="status"></div>
    <div id="resultsGrid" class="grid"></div>
  </section>

  <!-- Vista Collezione -->
  <section id="collectionView" class="view hidden" role="tabpanel">
    <div id="collectionGrid" class="grid"></div>
  </section>

  <!-- Dialog impostazioni -->
  <div id="settingsDialog" class="dialog-overlay hidden" role="dialog" aria-modal="true">
    <div class="dialog">
      <div class="dialog-header">
        <span>Settings</span>
        <button class="dialog-close" id="settingsClose" aria-label="Chiudi">
          <span class="material-icons">close</span>
        </button>
      </div>
      <div class="dialog-body">
        <div class="text-field-outlined">
          <label for="keyAlphelo">Alphelo API Key</label>
          <input type="password" id="keyAlphelo" placeholder="alp_…" autocomplete="off" />
        </div>
        <div class="text-field-outlined">
          <label for="keyRemovebg">Remove.bg API Key</label>
          <input type="password" id="keyRemovebg" placeholder="API key here" autocomplete="off" />
        </div>
        <div class="text-field-outlined">
          <label for="keyClipdrop">Clipdrop API Key</label>
          <input type="password" id="keyClipdrop" placeholder="API key here" autocomplete="off" />
        </div>
        <div class="text-field-outlined">
          <label for="keyPhotoroom">Photoroom API Key</label>
          <input type="password" id="keyPhotoroom" placeholder="API key here" autocomplete="off" />
        </div>
      </div>
      <div class="dialog-footer">
        <button class="btn-text" id="settingsCancel">Cancel</button>
        <button class="btn-primary" id="settingsSave">Save</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
